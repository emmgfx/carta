<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carta</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="rack-head" data-tauri-drag-region>
      <span class="wtitle">Carta</span>
        <div class="themebar" role="group" aria-label="Appearance">
          <button class="tbtn" data-choice="light" title="Light" aria-label="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" /><path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
            </svg>
          </button>
          <button class="tbtn" data-choice="dark" title="Dark" aria-label="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
            </svg>
          </button>
          <button class="tbtn" data-choice="auto" title="Match system" aria-label="Match system">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="14" x="2" y="3" rx="2" />
              <line x1="8" x2="16" y1="21" y2="21" /><line x1="12" x2="12" y1="17" y2="21" />
            </svg>
          </button>
        </div>
      </header>
    <main class="scroll" id="scroll">
    <div class="rack">

      <section id="drop" class="drop">
        <p class="drop-title">Drop a video</p>
        <p class="drop-sub">mkv · mp4 · avi · mov · ts</p>
        <button id="pick" class="link">or pick one from disk</button>
      </section>

      <section id="report" class="hidden">
        <div class="tabs" role="tablist">
          <button class="tab" data-panel="summary" role="tab" aria-selected="true">Summary</button>
          <button class="tab" data-panel="tracks" role="tab" aria-selected="false">Tracks</button>
          <button class="tab hidden" data-panel="run" role="tab" aria-selected="false" id="tabRun">Conversion</button>
          <hr />
        </div>

        <div id="panel-summary">
          <div class="plate" id="plate">
            <div class="flow">
              <span class="big" id="fmtFrom"></span>
              <span class="wire"></span>
              <span class="est" id="est"></span>
              <span class="wire"></span>
              <svg class="head" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 18 6-6-6-6" />
              </svg>
              <span class="big to" id="fmtTo">MP4</span>
            </div>

            <div class="ends">
              <div class="end">
                <div class="name" id="nameFrom"></div>
                <div class="meta" id="metaFrom"></div>
              </div>
              <div class="end to">
                <input class="name" id="nameTo" spellcheck="false"
                       aria-label="Output file name" />
                <div class="meta" id="metaTo"></div>
              </div>
            </div>

            <p class="verdict-bar" id="speed"></p>
          </div>
          <div id="warnings"></div>

          <div id="settings">
            <div class="label-row"><span class="label">Settings</span><hr /></div>
            <div class="settings">
              <label class="toggle hidden" id="fatField">
                <input type="checkbox" id="fat32" />
                Cap output at 4 GB (FAT32)
              </label>
              <label class="field hidden" id="encoderField">
                <span>Re-encode with</span>
                <select id="encoder">
                  <option value="videotoolbox">VideoToolbox</option>
                  <option value="x264">libx264</option>
                </select>
              </label>
            </div>
          </div>
        </div>

        <div id="panel-tracks" class="hidden">
          <div class="thead" aria-hidden="true">
            <span></span><span></span>
            <span>Track</span><span>Codec</span><span>Details</span><span>Action</span>
          </div>
          <ul class="tracks" id="tracks"></ul>
        </div>

        <div id="panel-run" class="hidden">
          <div class="run-head">
            <span id="phase"></span>
            <span class="rate" id="rate"></span>
          </div>
          <div class="scrub"><div id="fill"></div></div>
          <div class="timecode"><b id="tcNow">00:00:00</b><span id="tcEnd">00:00:00</span></div>

          <div id="result" class="hidden"></div>
          <pre id="log" class="log hidden"></pre>
        </div>
      </section>
    </div>
    </main>

    <p class="colophon">
      <span id="version"></span>
      <button id="author" class="link">by emmgfx</button>
      <span aria-hidden="true">·</span>
      <button id="source" class="link">Source on GitHub</button>
      <span aria-hidden="true">·</span>
      <button id="licenses" class="link">Licenses</button>
    </p>

    <div id="dock" class="dock hidden">
      <div class="dock-row">
        <button id="reset" class="ghost">Change video</button>
        <div class="dock-right">
          <button id="cancel" class="ghost hidden">Cancel</button>
          <button id="convert" class="go">Convert</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
