[package]
name = "carta"
version = "0.1.0"
description = "Get your videos ready to play on the TV"
authors = ["emmgfx"]
license = "MIT"
repository = "https://github.com/emmgfx/carta"
edition = "2021"

[lib]
name = "carta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
